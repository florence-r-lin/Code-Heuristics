[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Code_Heuristics"
version = "0.1.0"
description = "Gives you Metrics based on students final submissions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Yuan Garcia", email = "ygarcia@g.hmc.edu" },
  { name = "Aidan Deshong", email = "adeshong@g.hmc.edu"}
]

dependencies = [
  "requests>=2.31,<3.0",
  "numpy>=1.26,<2.0"
]