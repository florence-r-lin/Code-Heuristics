[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Code_Heuristics"
version = "0.1.0"
description = "Gives you Metrics based on students final submissions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Yuan Garcia", email = "ygarcia@g.hmc.edu" },
  { name = "Aidan Deshong", email = "adeshong@g.hmc.edu"}
]

dependencies = [
  "matplotlib>=3.9.4",
  "numpy>=2.0.2",
  "pandas>=2.3.2",
  "requests>=2.32.5",
  "scipy>=1.13.1",
]
